plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// ===== 主模组标识与开发版 jar 路径 =====
def mainProperties = new Properties()
file('../gradle.properties').withInputStream { mainProperties.load(it) }
def mainModId = mainProperties.getProperty('main_mod_id', 'kogasa_addiction')
def mainModVersion = mainProperties.getProperty('mod_version')
// 主工程的 devJar 产物（未 reobf 的开发版，MCP 名）
def mainModDevJar = file("../build/libs/${mainModId}-${mainModVersion}-dev.jar")

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // 主模组通过 run/mods 里的“开发版 jar”（MCP 名、未 reobf）加载，见 syncMainMod 任务。
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // 主模组的开发输出里，mixin refmap 记录的是 SRG 方法名（如 m_40932_）。
            // 开发环境运行在 MCP 名环境下，需要 Forge 把 refmap 重映射到 MCP，
            // 否则会报 InvalidAccessorException: No candidates were found matching m_xxxxx_。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/../build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/../build/createSrgToMcp/output.srg"
        }

        // datagen：产物输出到 src/generated/resources（打包时会一并带上）
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
            // 软依赖（Patchouli 等）在 datagen 环境里也会加载，mixin refmap 同样需要重映射
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/../build/createSrgToMcp/output.srg"
        }
    }
}

// datagen 产物目录参与资源打包
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url "https://modmaven.dev/" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 依赖主模组：编译期直接引用主工程编译输出；
    // 开发环境运行期由 syncMainMod 把主工程的开发版 jar 同步进 run/mods（见下方任务）。
    compileOnly files('../build/classes/java/main')

    // ===== 软依赖：只在开发环境提供，便于查看主模组的手册与 JEI 内容 =====
    // 刻意不写进 mods.toml：附属本身不依赖它们，缺了也能正常加载。
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
}

tasks.named('processResources', ProcessResources).configure {
    // 资源文件是 UTF-8，显式指定过滤编码，避免中文注释在 Windows 默认编码下变乱码
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
            main_mod_id         : main_mod_id, main_mod_version_range: main_mod_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 排除 datagen 的缓存目录，避免被打进 jar
processResources {
    exclude '.cache'
    exclude '.cache/**'
}

// ===== 子工程编译依赖主模组的编译产物：编译前自动编译父工程 =====
// 用独立 Gradle 进程执行父工程的 compileJava；父工程源码未变动时，
// 这个任务会被 Gradle 的增量判断直接判为 UP-TO-DATE，不会重复编译。
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('compileMainProject', Exec) {
    description = '编译父工程（主模组），只在父工程源码变动时实际执行'

    // 父工程侧的一键任务（addonBuild / addonRunClient）已经先编译过主模组，
    // 会设置跳过标记（环境变量或项目属性），避免子构建再嵌套编译父工程造成重复/等待。
    onlyIf {
        System.getenv('KOGASA_SKIP_MAIN_COMPILE') == null
                && !project.hasProperty('kogasaSkipMainCompile')
    }

    inputs.dir file('../src/main/java')
    inputs.dir file('../src/main/resources')
    inputs.dir file('../src/generated/resources')
    outputs.dir file('../build/classes/java/main')
    outputs.file mainModDevJar

    workingDir file('..')
    if (isWindows) {
        commandLine 'cmd', '/c', 'gradlew.bat compileJava processResources createSrgToMcp devJar --console=plain'
    } else {
        commandLine 'sh', '-c', './gradlew compileJava processResources createSrgToMcp devJar --console=plain'
    }
}

tasks.named('compileJava') {
    dependsOn 'compileMainProject'
}

// ===== 开发运行：把主模组的开发版 jar 同步进 run/mods =====
tasks.register('syncMainMod', Copy) {
    dependsOn 'compileMainProject'
    from mainModDevJar
    into file('run/mods')
    doFirst {
        if (!mainModDevJar.exists()) {
            throw new GradleException(
                    "缺少主模组开发版 jar：${mainModDevJar}" +
                    "\n请先在主工程目录执行：gradlew devJar")
        }
    }
}

// datagen 的 gameDir 是 run-data，主模组 jar 也要放一份到 run-data/mods
tasks.register('syncMainModData', Copy) {
    dependsOn 'compileMainProject'
    from mainModDevJar
    into file('run-data/mods')
}

// ForgeGradle 的运行任务在配置阶段之后才创建，用 configureEach 按名字挂依赖。
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn 'syncMainMod'
    }
    if (name == 'runData') {
        dependsOn 'syncMainModData'
    }
}
