plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Local dev mods"
        url = uri(rootProject.file("libs/maven"))
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url = "https://maven.createmod.net" }
    maven { url "https://modmaven.dev/" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")

    compileOnly fg.deobf("teamtwilight:twilightforest:${twilight_forest_version}:universal")
    runtimeOnly fg.deobf("teamtwilight:twilightforest:${twilight_forest_version}:universal")

    // ===== 魔法模组兼容：只挂开发环境，不写进 mods.toml =====
    // Iron's Spells / Ars Nouveau / Goety / Goety Revelation 均为软依赖
    compileOnly fg.deobf("maven.modrinth:curios:${curios_version}")
    compileOnly fg.deobf("local.kogasa:geckolib:4.8.4")
    runtimeOnly fg.deobf("local.kogasa:geckolib:4.8.4")
    compileOnly fg.deobf("maven.modrinth:playeranimator:${playeranimator_version}")
    runtimeOnly fg.deobf("maven.modrinth:playeranimator:${playeranimator_version}")
    compileOnly fg.deobf("maven.modrinth:irons-lib:${irons_lib_version}")
    runtimeOnly fg.deobf("maven.modrinth:irons-lib:${irons_lib_version}")
    compileOnly fg.deobf("maven.modrinth:irons-spells-n-spellbooks:${irons_spells_version}")
    runtimeOnly fg.deobf("maven.modrinth:irons-spells-n-spellbooks:${irons_spells_version}")
    compileOnly fg.deobf("local.kogasa:fantasy_ending:2.7.20g")
    runtimeOnly fg.deobf("local.kogasa:fantasy_ending:2.7.20g")
    compileOnly fg.deobf("local.kogasa:ars_nouveau:4.12.7")
    runtimeOnly fg.deobf("local.kogasa:ars_nouveau:4.12.7")
    compileOnly fg.deobf("maven.modrinth:goety:${goety_version}")
    runtimeOnly fg.deobf("maven.modrinth:goety:${goety_version}")
    compileOnly fg.deobf("maven.modrinth:endinglibrary:${ending_library_version}")
    runtimeOnly fg.deobf("maven.modrinth:endinglibrary:${ending_library_version}")
    compileOnly fg.deobf("maven.modrinth:goety-revelation:${goety_revelation_version}")
    runtimeOnly fg.deobf("maven.modrinth:goety-revelation:${goety_revelation_version}")

    // FantasyEnding 未公开/不便自动拉取，使用本地 jar；不打包进发布 jar

    // ===== 灾变（L_Ender's Cataclysm）本体：构建 + 运行都用这个 jar =====
    compileOnly fg.deobf("maven.modrinth:l_enders-cataclysm:${cataclysm_version}")
    runtimeOnly fg.deobf("maven.modrinth:l_enders-cataclysm:${cataclysm_version}")
    // 灾变运行需要的库：只放运行期，编译期不需要
    runtimeOnly fg.deobf("maven.modrinth:lionfish-api:${lionfish_version}")
    runtimeOnly fg.deobf("maven.modrinth:curios:${curios_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

processResources {
    exclude '.cache'
    exclude '.cache/**'
    // lang_src 只是 datagen 源文件，不打包进 jar
    exclude 'lang_src/**'
}

// ===== 供附属模组开发环境使用的"开发版"jar =====
// 注意：build/libs 里默认产物是 reobf 过的发布版（SRG 名），开发环境用的是 MCP 名，
// 直接放进 run/mods 会报 NoSuchFieldError: f_xxxxx_ / InvalidAccessorException。
// 这个任务打包**未 reobf** 的开发版，附属的 runClient / runServer 加载它。
tasks.register('devJar', Jar) {
    group = 'kogasa addon'
    description = '打包开发版主模组 jar（未 reobf，供附属模组开发运行使用）'
    archiveClassifier = 'dev'
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ===== 兼容附属（复合构建 kogasa_addiction_compat）的一键入口 =====
// 先编译主模组，再构建 / 启动附属客户端；IDEA 右侧 Gradle 栏里可直接双击运行。
// 用 GradleBuild（同 daemon 内的嵌套构建）而不是另起进程：不会和父构建抢工程目录的文件锁。
def addonDir = file('kogasa_addiction_compat')
if (addonDir.exists()) {
    tasks.register('compatBuild', GradleBuild) {
        group = 'kogasa addon'
        description = '编译主模组后构建兼容附属'
        dependsOn 'compileJava', 'processResources', 'createSrgToMcp', 'devJar'
        dir = addonDir
        tasks = ['build']
        // 主模组已由本任务依赖编译，让附属构建跳过它自己的"先编译父工程"步骤
        startParameter.projectProperties = ['kogasaSkipMainCompile': 'true', 'kogasaParentBuild': 'true']
    }

    tasks.register('compatRunClient', GradleBuild) {
        group = 'kogasa addon'
        description = '编译主模组后启动兼容附属的客户端'
        dependsOn 'compileJava', 'processResources', 'createSrgToMcp', 'devJar'
        dir = addonDir
        tasks = ['runClient']
        startParameter.projectProperties = ['kogasaSkipMainCompile': 'true', 'kogasaParentBuild': 'true']
    }

    tasks.register('compatRunServer', GradleBuild) {
        group = 'kogasa addon'
        description = '编译主模组后启动兼容附属的服务端（验证加载用）'
        dependsOn 'compileJava', 'processResources', 'createSrgToMcp', 'devJar'
        dir = addonDir
        tasks = ['runServer']
        startParameter.projectProperties = ['kogasaSkipMainCompile': 'true', 'kogasaParentBuild': 'true']
    }
}

// ===== datagen 缓存：runData 结束后自动删除，避免 .cache 堆在 src/generated 里 =====
tasks.register('cleanDataCache', Delete) {
    delete file('src/generated/resources/.cache')
}

tasks.configureEach {
    if (name == 'runData') {
        finalizedBy 'cleanDataCache'
    }
}
